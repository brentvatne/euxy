# On every push to main: fingerprint the native project. If the fingerprint
# matches an existing build for a profile, skip building — production ships as
# an OTA update instead. Only a changed native fingerprint triggers real
# builds, and a fresh production build auto-submits to TestFlight.
# EXCEPTION: while the production update channel is PAUSED (e.g. a release is
# fenced off for external beta), an OTA would never deliver — so a paused
# channel forces a real production build even when the fingerprint matches.
# Pattern: https://docs.expo.dev/eas/workflows/examples/ (deploy to production)
name: Deploy

on:
  push:
    branches: ['main']

# A rapid series of pushes to main should only ship the tip, not every
# intermediate commit — a new GitHub-triggered run cancels whatever is still in
# progress for this file on this branch.
#
# `group` is NOT a name we chose and is NOT evaluated. The schema pins it to
# this exact literal (a `const`) and also requires it, so any other value — or
# omitting it — fails validation. It is a placeholder spelling out the grouping
# EAS currently hard-codes (per workflow file, per branch); typing it verbatim
# now means behavior won't shift if custom groups ship later.
concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  check_channel:
    name: Check production channel pause state
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - uses: eas/checkout
      # eas-cli evaluates app.json (config plugins) for project context, so
      # the project must be installed first — without node_modules,
      # channel:view dies on "Failed to resolve plugin 'expo-router'".
      - uses: eas/install_node_modules
      - id: check
        name: Read isPaused from eas channel:view
        run: |
          PAUSED=$(npx --yes eas-cli@21.3.0 channel:view production --json --non-interactive \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).currentPage.isPaused===true))")
          echo "production channel paused: $PAUSED"
          set-output paused "$PAUSED"

  get_dev_build:
    name: Check for existing dev-simulator build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: development-simulator

  get_prod_build:
    name: Check for existing production build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  build_dev:
    name: Build iOS dev simulator
    needs: [get_dev_build]
    if: ${{ !needs.get_dev_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: development-simulator

  build_prod:
    name: Build iOS production
    needs: [get_prod_build, check_channel]
    # Build when the fingerprint is new — or when the channel is paused, since
    # the OTA path below is a dead end then.
    if: ${{ !needs.get_prod_build.outputs.build_id || needs.check_channel.outputs.paused == 'true' }}
    type: build
    params:
      platform: ios
      profile: production

  submit_prod:
    name: Submit to TestFlight
    needs: [build_prod]
    type: submit
    params:
      build_id: ${{ needs.build_prod.outputs.build_id }}

  publish_update:
    name: Publish OTA update (fingerprint unchanged)
    needs: [get_prod_build, check_channel]
    if: ${{ needs.get_prod_build.outputs.build_id && needs.check_channel.outputs.paused != 'true' }}
    type: update
    params:
      branch: production
      platform: ios
