# Agent work session (runs on EAS). GitHub Actions dispatches only the
# immutable issue/comment IDs after its event-envelope gate. This workflow
# re-fetches those records with the machine-user token, repeats authorization,
# runs Claude and simulator verification, then pushes a branch and opens a PR.
# Never auto-merges.
#
# Requires EAS preview secrets: CLAUDE_CODE_OAUTH_TOKEN, GH_TOKEN, EXPO_TOKEN.
# No autonomous agent or GitHub write credential runs on GitHub Actions.

name: Agent work session

on:
  workflow_dispatch:
    inputs:
      event_name:
        description: GitHub event name (issues or issue_comment)
        type: string
      issue_number:
        description: Immutable GitHub issue number
        type: string
      issue_id:
        description: Immutable GitHub issue database ID
        type: string
      comment_id:
        description: Immutable approval comment ID (blank for issue-open events)
        type: string
        default: ''

jobs:
  agent_work:
    name: Run agent work session
    environment: preview
    runs_on: linux-medium
    env:
      REPO_SLUG: brentvatne/euxy
      EVENT_NAME: ${{ inputs.event_name }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      ISSUE_ID: ${{ inputs.issue_id }}
      COMMENT_ID: ${{ inputs.comment_id }}
      WORKFLOW_URL: ${{ workflow.url }}
      AGENT_WORK_ALLOWLIST: '["brentvatne"]'
      AGENT_PROMPT_FILE: prompts/automation/agent-work.md
      SIMULATOR_PROMPT_FILE: prompts/automation/simulator-verification.md
      SIMULATOR_VALIDATION: '1'
      PUBLIC_SIMULATOR_EVIDENCE: '1'
      SIMULATOR_ARTIFACT_DIR: .eas/agent-work/sim
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install pinned agent toolchain
        run: bash .github/scripts/setup-agent-toolchain.sh
      - name: Run agent work session
        run: bun .eas/agent-work/agent-work.ts
      - name: Upload agent work summary
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: agent-work-summary
          path: |
            .eas/agent-work/ANALYSIS.md
            .eas/agent-work/issue.json
            .eas/agent-work/PUBLIC_FINDINGS.json
            .eas/agent-work/sim/**/*
            .eas/agent-work/RESCUED_WORK.patch
            .eas/agent-work/RESCUED_WORK.md
