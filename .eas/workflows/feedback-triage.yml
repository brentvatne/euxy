# Feedback triage — PRODUCTION trigger. When a TestFlight tester submits
# SCREENSHOT feedback, resolve it with a Claude agent: implement a fix, open a
# PR, and publish the fix as an EAS Update to a channel for OTA testing.
#
# Mirrors crash-triage, but for screenshot feedback. Only allowlisted testers'
# feedback is acted on (ALLOWED_FEEDBACK_EMAILS). Never auto-merges.
# For manual runs use .eas/workflows/feedback-triage-test.yml (workflow_dispatch)
# — App Store Connect context and dispatch inputs can't coexist in one file.
#
# Requires: the App Store Connect connection + the GitHub repo connected to the
# EAS project. EAS env vars (preview, secret): CLAUDE_CODE_OAUTH_TOKEN,
# GH_TOKEN, EXPO_TOKEN.

name: Feedback triage

on:
  app_store_connect:
    beta_feedback:
      types:
        - screenshot

jobs:
  triage:
    name: Resolve TestFlight feedback with Claude
    environment: preview
    runs_on: linux-medium
    env:
      REPO_SLUG: brentvatne/euxy
      AGENT_PROMPT_FILE: prompts/automation/feedback-triage.md
      ALLOWED_FEEDBACK_EMAILS: brentvatne@gmail.com
      DISABLE_AUTOUPDATER: '1'
      FEEDBACK_URL: ${{ app_store_connect.beta_feedback.url }}
      UPDATE_CHANNEL: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install pinned agent toolchain
        run: bash .github/scripts/setup-agent-toolchain.sh
      - name: Triage feedback
        run: bun .eas/feedback-triage/feedback-triage.ts
      - name: Upload triage summary
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: feedback-triage-summary
          path: |
            .eas/feedback-triage/ANALYSIS.md
            .eas/feedback-triage/feedback.json
            .eas/feedback-triage/PUBLIC_PR.json
