# Feedback triage — PRODUCTION trigger. Every TestFlight screenshot report gets
# a summarized GitHub issue. Feedback from the maintainer continues through
# implementation, simulator verification, PR creation, and a preview EAS Update.
# Other testers' reports pause until brentvatne comments `@notbrent accept …`.
#
# The public summary and its isolated safety review run without tools. Only
# allowlisted testers start the coding agent automatically. Never auto-merges.
# For manual runs use .eas/workflows/feedback-triage-test.yml (workflow_dispatch)
# — App Store Connect context and dispatch inputs can't coexist in one file.
#
# Requires: the App Store Connect connection + the GitHub repo connected to the
# EAS project. EAS env vars (preview, secret): CLAUDE_CODE_OAUTH_TOKEN,
# GH_TOKEN, EXPO_TOKEN.

name: Feedback triage

on:
  app_store_connect:
    beta_feedback:
      types:
        - screenshot

jobs:
  triage:
    name: Intake and resolve TestFlight feedback
    environment: preview
    runs_on: linux-medium
    env:
      REPO_SLUG: brentvatne/euxy
      INTAKE_PROMPT_FILE: prompts/automation/feedback-intake.md
      INTAKE_SAFETY_PROMPT_FILE: prompts/automation/feedback-intake-safety.md
      AGENT_PROMPT_FILE: prompts/automation/feedback-triage.md
      SIMULATOR_PROMPT_FILE: prompts/automation/simulator-verification.md
      SIMULATOR_VALIDATION: '1'
      SIMULATOR_ARTIFACT_DIR: .eas/feedback-triage/sim
      PUBLIC_SIMULATOR_EVIDENCE: '1'
      ALLOWED_FEEDBACK_EMAILS: brentvatne@gmail.com
      DISABLE_AUTOUPDATER: '1'
      WORKFLOW_URL: ${{ workflow.url }}
      FEEDBACK_ID: ${{ app_store_connect.beta_feedback.id }}
      FEEDBACK_URL: ${{ app_store_connect.beta_feedback.url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install pinned agent toolchain
        run: bash .github/scripts/setup-agent-toolchain.sh
      - name: Triage feedback
        run: bun .eas/feedback-triage/feedback-triage.ts
      - name: Upload triage summary
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: feedback-triage-summary
          path: |
            .eas/feedback-triage/ANALYSIS.md
            .eas/feedback-triage/feedback.json
            .eas/feedback-triage/PUBLIC_REPORT.json
            .eas/feedback-triage/PUBLIC_PR.json
            .eas/feedback-triage/sim/**/*
