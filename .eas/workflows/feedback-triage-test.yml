# Feedback triage — MANUAL dispatch (test / on-demand). Same job as
# feedback-triage.yml but driven by workflow_dispatch inputs instead of the
# screenshot trigger, so you can resolve the latest (or a specific) feedback on
# demand:
#
#   eas workflow:run .eas/workflows/feedback-triage-test.yml
#   eas workflow:run .eas/workflows/feedback-triage-test.yml -F feedback=<id-or-ASC-url>
#
# Kept separate from the production workflow because EAS validates job params
# against the trigger's context — app_store_connect.* and dispatch inputs can't
# live in the same file.

name: Feedback triage (test)

on:
  workflow_dispatch:
    inputs:
      feedback:
        description: Feedback id or App Store Connect URL (blank = latest screenshot feedback)
        type: string
        default: ''
jobs:
  triage:
    name: Resolve TestFlight feedback with Claude (test)
    environment: preview
    runs_on: linux-medium
    env:
      REPO_SLUG: brentvatne/euxy
      AGENT_PROMPT_FILE: prompts/automation/feedback-triage.md
      ALLOWED_FEEDBACK_EMAILS: brentvatne@gmail.com
      DISABLE_AUTOUPDATER: '1'
      INPUT_FEEDBACK: ${{ inputs.feedback }}
      UPDATE_CHANNEL: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Install pinned agent toolchain
        run: bash .github/scripts/setup-agent-toolchain.sh
      - name: Triage feedback
        run: bun .eas/feedback-triage/feedback-triage.ts
      - name: Upload triage summary
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: feedback-triage-summary
          path: |
            .eas/feedback-triage/ANALYSIS.md
            .eas/feedback-triage/feedback.json
            .eas/feedback-triage/PUBLIC_PR.json
