# GitHub review and PR-comment events are not currently EAS Workflow triggers,
# so this credential-minimal workflow verifies the event envelope and dispatches
# immutable IDs to trusted workflow code on EAS. The autonomous agent and GitHub
# write token remain on EAS.

name: Respond to PR feedback

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: pr-review-response-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'brentvatne/euxy'
      && (
        (
          github.event_name == 'pull_request_review'
          && github.event.review.state == 'changes_requested'
          && github.event.review.user.login == 'brentvatne'
          && contains(
            fromJSON('["brentvatne","notbrent"]'),
            github.event.pull_request.user.login
          )
          && github.event.pull_request.head.repo.full_name == github.repository
        )
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.login == 'brentvatne'
          && (
            startsWith(github.event.comment.body, '@notbrent ')
            || startsWith(github.event.comment.body, '@notbrent:')
            || startsWith(github.event.comment.body, '@notbrent,')
          )
        )
      )
    runs-on: ubuntu-latest
    outputs:
      run_url: ${{ steps.eas.outputs.run_url }}
    steps:
      - name: Dispatch trusted EAS workflow
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: 2ee288d6-807b-4316-8331-d0f5cd5eebe8
          TRUSTED_GIT_REF: ${{ github.event.pull_request.base.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Missing the EXPO_TOKEN repository secret used to dispatch EAS Workflows."
            exit 1
          fi

          payload="$(
            jq -n \
              --arg app_id "$EAS_PROJECT_ID" \
              --arg git_ref "$TRUSTED_GIT_REF" \
              --arg pr "$PR_NUMBER" \
              --arg review_id "$REVIEW_ID" \
              --arg comment_id "$COMMENT_ID" \
              '{
                appId: $app_id,
                gitRef: $git_ref,
                fileName: "pr-review-response.yml",
                inputs: {
                  pr: $pr,
                  review_id: $review_id,
                  comment_id: $comment_id
                }
              }'
          )"
          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $EXPO_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              https://api.expo.dev/v2/workflows/dispatch
          )"
          run_url="$(jq -r '.data.url // empty' <<<"$response")"
          if [[ -z "$run_url" ]]; then
            echo "::error::EAS accepted the request but returned no workflow URL."
            exit 1
          fi
          echo "Dispatched EAS workflow: $run_url"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

  acknowledge:
    name: Link the dispatched workflow
    needs: dispatch
    if: github.event_name == 'issue_comment'
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Reply with the EAS workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ needs.dispatch.outputs.run_url }}
        run: |
          if [[ ! "$RUN_URL" =~ ^https://expo\.dev/accounts/brent-org/projects/euxy/workflows/[a-z0-9-]+$ ]]; then
            echo "::error::EAS returned an unexpected workflow URL."
            exit 1
          fi
          comment_url="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --field body="🤖 Started the [EAS workflow]($RUN_URL) for this request." \
              --jq '.html_url'
          )"
          if [[ -z "$comment_url" ]]; then
            echo "::error::GitHub accepted no acknowledgement comment."
            exit 1
          fi
          echo "Acknowledged dispatch: $comment_url"
