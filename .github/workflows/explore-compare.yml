# Generated by expo-explore setup. Edits are kept across upgrades; rerun setup --workflows --force to regenerate. Fingerprint: 6751169ce7608d9c
# Install on the default branch. Reviews any two commits of this repository, with no pull request:
# run it from the Actions tab, or call it from any workflow with the base and head that event needs.
#
#   on: { push: { tags: ['v*'] } }
#   jobs:
#     explore:
#       permissions: { contents: read, actions: read }
#       uses: ./.github/workflows/explore-compare.yml
#       with: { base: v1.3.0, head: '${{ github.ref_name }}' }
#       secrets: inherit
#
# Call it once per workflow run: a called workflow shares its caller's run, and its artifact names come from the run.
# The report links are written to the run's summary. For a release, pass scope: all to capture every screen. A hosted
# link (report.preview.hosting: eas) lasts as long as its EAS Hosting deployment; expires-in is accepted and ignored.
name: Expo Explore compare
on:
  workflow_dispatch:
    inputs:
      base: { description: 'Base: a branch, tag or commit SHA', required: true }
      head: { description: 'Head: a branch, tag or commit SHA', required: true }
      scope: { description: 'changes (screens whose source changed) or all; default: exploration.scope in config.yaml', required: false, default: '' }
      expires-in: { description: 'Ignored: kept for workflows that pass it. A hosted preview lasts as long as its EAS Hosting deployment.', required: false, default: '' }
  workflow_call:
    inputs:
      base: { description: 'Base: a branch, tag or commit SHA', required: true, type: string }
      head: { description: 'Head: a branch, tag or commit SHA', required: true, type: string }
      scope: { description: 'changes (screens whose source changed) or all; default: exploration.scope in config.yaml', required: false, type: string, default: '' }
      expires-in: { description: 'Ignored: kept for workflows that pass it. A hosted preview lasts as long as its EAS Hosting deployment.', required: false, type: string, default: '' }
permissions: {}
env:
  # The exact @expo/explore release CI installs. expo-explore setup --workflows sets it.
  EXPLORE_VERSION: 0.20.2
  APP_PROJECT_DIR: .
  APP_INSTALL_DIR: .
  TOOLS_PREFIX: explore-tools
  TOOLS: explore-tools/package
concurrency:
  # ".." cannot appear in a ref name, so no two different comparisons share a group.
  group: explore-compare-${{ inputs.base }}..${{ inputs.head }}
  cancel-in-progress: false
jobs:
  # Resolves both refs to commits once, and lists the targets .expo-explore/config.yaml captures at head.
  targets:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      max_parallel: ${{ steps.targets.outputs.max_parallel }}
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
      compare: ${{ steps.refs.outputs.compare }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: app-head, fetch-depth: 0, persist-credentials: false }
      - &setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, package-manager-cache: false }
      - &install-explore
        name: Install Explore
        id: explore
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPLORE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error title=EXPLORE_VERSION_INVALID::Set EXPLORE_VERSION to an exact @expo/explore version. Run expo-explore setup --workflows.'; exit 1
          fi
          # npm ci against the release's npm-shrinkwrap.json installs the exact dependency tree it was tested with.
          mkdir -p "$TOOLS_PREFIX"
          npm pack "@expo/explore@$EXPLORE_VERSION" --pack-destination "$TOOLS_PREFIX" --silent > /dev/null
          tar -xzf "$TOOLS_PREFIX"/expo-explore-*.tgz -C "$TOOLS_PREFIX"
          cd "$TOOLS"
          npm ci --omit=dev --include=optional --ignore-scripts --no-audit --no-fund
      - name: Resolve base and head to commits
        id: refs
        env:
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:compare-refs --project app-head --base "$BASE_REF" --head "$HEAD_REF"
      - name: Check out head
        env:
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        shell: bash
        run: git -C app-head checkout --quiet --detach "$HEAD_SHA"
      - name: List the configured targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          listed="$(node "$TOOLS/dist/cli.js" config:targets --project "$GITHUB_WORKSPACE/app-head/$APP_PROJECT_DIR" --config .expo-explore/config.yaml)"
          echo "targets=$(jq -c '[.targets[].id]' <<< "$listed")" >> "$GITHUB_OUTPUT"
          # Each target job needs a simulator session: at most capture.maxSessions of them run at once.
          echo "max_parallel=$(jq '.maxParallel // (.targets | length)' <<< "$listed")" >> "$GITHUB_OUTPUT"
  capture:
    needs: targets
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.targets.outputs.max_parallel) }}
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      # "eas" when .expo-explore/config.yaml sets report.preview.hosting; the deploy job runs only then.
      preview: ${{ steps.capture.outputs.preview }}
    env:
      TARGET: ${{ matrix.target }}
      BASE_SHA: ${{ needs.targets.outputs.base }}
      HEAD_SHA: ${{ needs.targets.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ needs.targets.outputs.base }}', path: app-base, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ needs.targets.outputs.head }}', path: app-head, fetch-depth: 0, persist-credentials: false }
      - *setup-node
      - *install-explore
      - name: Install the launch recording decoder
        shell: bash
        # Launch recordings (capture.launch) are decoded with ffmpeg; GitHub's Ubuntu runners do not ship it.
        run: |
          set -euo pipefail
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null; }
          ffmpeg -version | head -1
      - name: Verify deterministic source planning
        env:
          SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          node "$TOOLS/dist/cli.js" source:verify \
            --base-project "$GITHUB_WORKSPACE/app-base/$APP_PROJECT_DIR" --head-project "$GITHUB_WORKSPACE/app-head/$APP_PROJECT_DIR" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --config .expo-explore/config.yaml --output "$RUNNER_TEMP/explore-consistency" \
            --target "$TARGET" ${SCOPE:+--scope "$SCOPE"}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install app dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd "app-base/$APP_INSTALL_DIR" && bun install --frozen-lockfile --ignore-scripts)
          (cd "app-head/$APP_INSTALL_DIR" && bun install --frozen-lockfile --ignore-scripts)
      - name: Find optional exact-base evidence
        id: cache
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:find-baseline --sha "$BASE_SHA" --target "$TARGET"
      - name: Download optional exact-base evidence
        if: steps.cache.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.cache.outputs.id }}
          path: ${{ runner.temp }}/explore-cache
          merge-multiple: true
          run-id: ${{ steps.cache.outputs.run }}
          github-token: ${{ github.token }}
      - name: Capture review
        id: capture
        env:
          COMPARE: ${{ needs.targets.outputs.compare }}
          SCOPE: ${{ inputs.scope }}
          EXPIRES_IN: ${{ inputs.expires-in }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # App-test secrets: one NAME: line per {{secret:NAME}} input in .expo-explore (expo-explore setup adds them).
          EXPLORE_CAPTURE_CACHE: ${{ runner.temp }}/explore-cache
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$COMPARE" > "$RUNNER_TEMP/explore-compare.json"
          node "$TOOLS/dist/cli.js" capture:review \
            --base-project "$GITHUB_WORKSPACE/app-base/$APP_PROJECT_DIR" --head-project "$GITHUB_WORKSPACE/app-head/$APP_PROJECT_DIR" \
            --compare "$RUNNER_TEMP/explore-compare.json" --output "$RUNNER_TEMP/explore-review" --config .expo-explore/config.yaml \
            --target "$TARGET" ${SCOPE:+--scope "$SCOPE"} ${EXPIRES_IN:+--expires-in "$EXPIRES_IN"}
      - name: Stop capture sessions and check the checkouts
        if: always() && steps.explore.outcome == 'success'
        timeout-minutes: 5
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:after-capture --output "$RUNNER_TEMP/explore-review" --checkout app-base --checkout app-head
      - name: Upload captured review for packaging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: explore-capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/explore-review/report-input.json
            ${{ runner.temp }}/explore-review/plan.json
            ${{ runner.temp }}/explore-review/bundle.json
            ${{ runner.temp }}/explore-review/review.json
            ${{ runner.temp }}/explore-review/execution.json
            ${{ runner.temp }}/explore-review/base-export
            ${{ runner.temp }}/explore-review/head-export
          retention-days: 7
          if-no-files-found: error
      - name: Upload planning and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: explore-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/explore-consistency
            ${{ runner.temp }}/explore-diagnostics
            ${{ runner.temp }}/explore-review/execution.json
            ${{ runner.temp }}/explore-review/diagnostics.json
            ${{ runner.temp }}/explore-review/base-export
            ${{ runner.temp }}/explore-review/head-export
            ${{ runner.temp }}/explore-review/base-map/capture-diagnostics
            ${{ runner.temp }}/explore-review/head-map/capture-diagnostics
            ${{ runner.temp }}/explore-review/agent-notes-diagnostics.json
            ${{ runner.temp }}/explore-review/agent-usage.jsonl
          retention-days: 7
          if-no-files-found: ignore
  # Each target's report runs once its own capture uploaded one, whatever the other targets' captures did, as in the
  # review workflow (brentvatne/euxy#172): needs.capture.result is the whole matrix's, so each leg looks for its own
  # artifact, and a target whose capture failed packages and links nothing. !cancelled() keeps a cancelled run stopped.
  report:
    needs: [targets, capture]
    if: needs.targets.result == 'success' && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # "true" from every leg that linked its report, so "true" once any did: the deploy job runs only then.
      published: ${{ steps.publish.outputs.published }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      # Downloading by name fails when the artifact is missing. A pattern that matches nothing downloads nothing and
      # succeeds, so only a download that went wrong fails this step; its one match is extracted into the path itself.
      - name: Download this target's captured review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: explore-capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/explore-review
      - name: Check that this target's capture succeeded
        id: captured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/explore-review/report-input.json" ]]; then echo "found=true" >> "$GITHUB_OUTPUT"
          else echo "The $TARGET capture uploaded no review: its capture job failed."; fi
      - *setup-node
      - *install-explore
      - name: Package the report
        if: steps.captured.outputs.found == 'true'
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:report --input "$RUNNER_TEMP/explore-review/report-input.json" --output "$RUNNER_TEMP/explore-report" --target "$TARGET"
      - name: Upload the report
        if: steps.captured.outputs.found == 'true'
        id: report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: explore-review-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/explore-report
          retention-days: 30
          if-no-files-found: error
      - name: Link the report from the run summary
        if: steps.captured.outputs.found == 'true'
        id: publish
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          node "$TOOLS/dist/cli.js" ci:publish --input "$RUNNER_TEMP/explore-review/report-input.json" --artifact-url "$ARTIFACT_URL" --target "$TARGET"
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Upload report failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: explore-report-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/explore-diagnostics
          retention-days: 7
          if-no-files-found: ignore
  # Hosted report (opt-in, report.preview in config.yaml): one token-gated EAS Hosting deployment serving every target's report.
  # This is the only job after capture that holds EXPO_TOKEN; it writes the link to the run summary.
  # It runs once any target linked its report, and serves the targets that did; a failed target has no report to wait for.
  deploy:
    needs: [targets, capture, report]
    if: needs.report.outputs.published == 'true' && needs.capture.outputs.preview == 'eas' && !cancelled()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - *setup-node
      - *install-explore
      # One directory per target artifact (explore-capture-<run>-<attempt>-<target>, explore-review-<run>-<attempt>-<target>),
      # or a lone artifact's files in the path itself; ci:deploy reads both.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: explore-capture-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/explore-review
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: explore-review-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/explore-report
      - name: Deploy the hosted report and link it from the run summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:deploy --inputs "$RUNNER_TEMP/explore-review" --reports "$RUNNER_TEMP/explore-report"
