          set -euo pipefail
          if [[ ! "$EXPLORE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error title=EXPLORE_VERSION_INVALID::Set EXPLORE_VERSION to an exact @expo/explore version. Run expo-explore setup --workflows.'; exit 1
          fi
          mkdir -p "$TOOLS_PREFIX"
          npm pack "@expo/explore@$EXPLORE_VERSION" --pack-destination "$TOOLS_PREFIX" --silent > /dev/null
          tar -xzf "$TOOLS_PREFIX"/expo-explore-*.tgz -C "$TOOLS_PREFIX"
          cd "$TOOLS"
          npm ci --omit=dev --include=optional --ignore-scripts --no-audit --no-fund
      - name: Report failure only on the current PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.capture.outputs.pr_number }}
          HEAD_SHA: ${{ needs.capture.outputs.head }}
          BASE_SHA: ${{ needs.capture.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          # The diagnostics artifacts are data files from this run and attempt, never executable report code;
          # the first error.json names the failed platform, and the comment keeps every other platform's result.
          node "$TOOLS/dist/cli.js" ci:failure --pr "${PR_NUMBER:-0}" --head "${HEAD_SHA:-}" --base "${BASE_SHA:-}" --diagnostics "$RUNNER_TEMP/explore-failure"
