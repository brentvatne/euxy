# Generated by expo-explore setup. Edits are kept across upgrades; rerun setup --workflows --force to regenerate. Fingerprint: dd1c60d906f6685b
# Install on the default branch. pull_request_target runs the default branch's copy of this file,
# so a pull request cannot change the Explore version that captures and publishes its review.
name: Expo Explore review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr: { description: Open same-repository pull request number, required: true }
permissions: {}
env:
  # The exact @expo/explore release CI installs. expo-explore setup --workflows sets it.
  EXPLORE_VERSION: 0.20.0
  APP_PROJECT_DIR: .
  APP_INSTALL_DIR: .
  TOOLS_PREFIX: explore-tools
  TOOLS: explore-tools/package
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
concurrency:
  group: explore-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false
jobs:
  # The targets .expo-explore/config.yaml captures (ios, android, or the devices under targets:): one capture and report job each.
  targets:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      max_parallel: ${{ steps.targets.outputs.max_parallel }}
      # The failure job comments with these when a capture job fails before it resolves the PR itself.
      pr_number: ${{ steps.pr.outputs.pr_number }}
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
    steps:
      - &setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, package-manager-cache: false }
      - &install-explore
        name: Install Explore
        id: explore
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPLORE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error title=EXPLORE_VERSION_INVALID::Set EXPLORE_VERSION to an exact @expo/explore version. Run expo-explore setup --workflows.'; exit 1
          fi
          # npm ci against the release's npm-shrinkwrap.json installs the exact dependency tree it was tested with.
          mkdir -p "$TOOLS_PREFIX"
          npm pack "@expo/explore@$EXPLORE_VERSION" --pack-destination "$TOOLS_PREFIX" --silent > /dev/null
          tar -xzf "$TOOLS_PREFIX"/expo-explore-*.tgz -C "$TOOLS_PREFIX"
          cd "$TOOLS"
          npm ci --omit=dev --include=optional --ignore-scripts --no-audit --no-fund
      - name: Resolve and authorize the live pull request
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:pr --pr "$PR_NUMBER" --app-dir "$APP_PROJECT_DIR"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ steps.pr.outputs.head }}', path: app-head, persist-credentials: false }
      - name: List the configured targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          listed="$(node "$TOOLS/dist/cli.js" config:targets --project "$GITHUB_WORKSPACE/app-head/$APP_PROJECT_DIR" --config .expo-explore/config.yaml)"
          echo "targets=$(jq -c '[.targets[].id]' <<< "$listed")" >> "$GITHUB_OUTPUT"
          # Each target job needs a simulator session: at most capture.maxSessions of them run at once.
          echo "max_parallel=$(jq '.maxParallel // (.targets | length)' <<< "$listed")" >> "$GITHUB_OUTPUT"
  capture:
    needs: targets
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.targets.outputs.max_parallel) }}
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      # The capture job keeps the sticky comment current while the run is still working.
      pull-requests: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
      # "eas" when .expo-explore/config.yaml sets report.preview.hosting; the deploy job runs only then.
      preview: ${{ steps.capture.outputs.preview }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - *setup-node
      - *install-explore
      - name: Resolve and authorize the live pull request
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:pr --pr "$PR_NUMBER" --app-dir "$APP_PROJECT_DIR" --output "$RUNNER_TEMP/explore-pr.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ steps.pr.outputs.base }}', path: app-base, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ steps.pr.outputs.head }}', path: app-head, fetch-depth: 0, persist-credentials: false }
      - name: Install the launch recording decoder
        shell: bash
        # Launch recordings (capture.launch) are decoded with ffmpeg; GitHub's Ubuntu runners do not ship it.
        run: |
          set -euo pipefail
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null; }
          ffmpeg -version | head -1
      - name: Verify deterministic source planning
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          node "$TOOLS/dist/cli.js" source:verify \
            --base-project "$GITHUB_WORKSPACE/app-base/$APP_PROJECT_DIR" --head-project "$GITHUB_WORKSPACE/app-head/$APP_PROJECT_DIR" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --config .expo-explore/config.yaml --output "$RUNNER_TEMP/explore-consistency" \
            --target "$TARGET"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install app dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd "app-base/$APP_INSTALL_DIR" && bun install --frozen-lockfile --ignore-scripts)
          (cd "app-head/$APP_INSTALL_DIR" && bun install --frozen-lockfile --ignore-scripts)
      - name: Find optional exact-base evidence
        id: cache
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:find-baseline --sha "$BASE_SHA" --target "$TARGET"
      - name: Download optional exact-base evidence
        if: steps.cache.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.cache.outputs.id }}
          path: ${{ runner.temp }}/explore-cache
          merge-multiple: true
          run-id: ${{ steps.cache.outputs.run }}
          github-token: ${{ github.token }}
      - name: Capture review
        id: capture
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # App-test secrets: one NAME: line per {{secret:NAME}} input in .expo-explore (expo-explore setup adds them).
          EXPLORE_CAPTURE_CACHE: ${{ runner.temp }}/explore-cache
        shell: bash
        run: |
          set -euo pipefail
          node "$TOOLS/dist/cli.js" capture:review \
            --base-project "$GITHUB_WORKSPACE/app-base/$APP_PROJECT_DIR" --head-project "$GITHUB_WORKSPACE/app-head/$APP_PROJECT_DIR" \
            --pull-request "$RUNNER_TEMP/explore-pr.json" --output "$RUNNER_TEMP/explore-review" --config .expo-explore/config.yaml \
            --target "$TARGET"
      - name: Stop capture sessions and check the checkouts
        if: always() && steps.pr.outcome == 'success'
        timeout-minutes: 5
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:after-capture --output "$RUNNER_TEMP/explore-review" --checkout app-base --checkout app-head
      - name: Upload captured review for packaging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: explore-capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/explore-review/report-input.json
            ${{ runner.temp }}/explore-review/plan.json
            ${{ runner.temp }}/explore-review/bundle.json
            ${{ runner.temp }}/explore-review/review.json
            ${{ runner.temp }}/explore-review/execution.json
            ${{ runner.temp }}/explore-review/base-export
            ${{ runner.temp }}/explore-review/head-export
          retention-days: 7
          if-no-files-found: error
      - name: Upload planning and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: explore-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/explore-consistency
            ${{ runner.temp }}/explore-diagnostics
            ${{ runner.temp }}/explore-review/execution.json
            ${{ runner.temp }}/explore-review/diagnostics.json
            ${{ runner.temp }}/explore-review/base-export
            ${{ runner.temp }}/explore-review/head-export
            ${{ runner.temp }}/explore-review/base-map/capture-diagnostics
            ${{ runner.temp }}/explore-review/head-map/capture-diagnostics
            ${{ runner.temp }}/explore-review/agent-notes-diagnostics.json
            ${{ runner.temp }}/explore-review/agent-usage.jsonl
          retention-days: 7
          if-no-files-found: ignore
  report:
    needs: [targets, capture]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - *setup-node
      - *install-explore
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: explore-capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/explore-review
      - name: Package hosted review bundle
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:report --input "$RUNNER_TEMP/explore-review/report-input.json" --output "$RUNNER_TEMP/explore-report" --target "$TARGET"
      - name: Upload hosted review bundle
        id: viewer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: explore-review-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/explore-report
          retention-days: 30
          if-no-files-found: error
      - name: Publish current PR hosted links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.viewer.outputs.artifact-url }}
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:publish --input "$RUNNER_TEMP/explore-review/report-input.json" --artifact-url "$ARTIFACT_URL" --target "$TARGET"
      - name: Upload report failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: explore-report-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/explore-diagnostics
          retention-days: 7
          if-no-files-found: ignore
  # Hosted preview (opt-in, report.preview in config.yaml): one token-gated EAS Hosting deployment per review, serving every target's report.
  # This is the only job after capture that holds EXPO_TOKEN; the report job stays credential-free and has already
  # published the Download report link, so a failed deployment leaves the comment on the download-and-drop flow.
  deploy:
    needs: [targets, capture, report]
    if: needs.capture.outputs.preview == 'eas'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - *setup-node
      - *install-explore
      # One directory per target artifact (explore-capture-<run>-<attempt>-<target>, explore-review-<run>-<attempt>-<target>).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: explore-capture-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/explore-review
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: explore-review-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/explore-report
      - name: Deploy the hosted preview and publish its Explore report links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: node "$TOOLS/dist/cli.js" ci:deploy --inputs "$RUNNER_TEMP/explore-review" --reports "$RUNNER_TEMP/explore-report"
  failure:
    needs: [targets, capture, report, deploy]
    if: always() && (needs.targets.result == 'failure' || needs.capture.result == 'failure' || needs.report.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download capture failure diagnostic
        if: needs.capture.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: explore-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/explore-failure/capture
      - name: Download report failure diagnostic
        if: needs.report.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: explore-report-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/explore-failure/report
      - *setup-node
      - *install-explore
      - name: Report failure only on the current PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.capture.outputs.pr_number || needs.targets.outputs.pr_number }}
          HEAD_SHA: ${{ needs.capture.outputs.head || needs.targets.outputs.head }}
          BASE_SHA: ${{ needs.capture.outputs.base || needs.targets.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          # The diagnostics artifacts are data files from this run and attempt, never executable report code;
          # the first error.json names the failed target, and the comment keeps every other target's result.
          node "$TOOLS/dist/cli.js" ci:failure --pr "${PR_NUMBER:-0}" --head "${HEAD_SHA:-}" --base "${BASE_SHA:-}" --diagnostics "$RUNNER_TEMP/explore-failure"
