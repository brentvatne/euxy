# GitHub issue events are not EAS Workflow triggers, so this credential-minimal
# workflow verifies the event envelope and dispatches immutable IDs to trusted
# workflow code on EAS. The autonomous agent and GitHub write token remain on EAS.

name: Dispatch agent work session

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: agent-work-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    # Automatically start work for allowlisted report authors. On every other
    # real GitHub issue,
    # only brentvatne may authorize work. The first command must be an exact
    # `@notbrent accept …`; later `@notbrent …` instructions inherit that
    # issue-scoped authorization. EAS re-fetches the issue and its comment
    # history, then repeats every check before running the agent.
    if: >-
      github.repository == 'brentvatne/euxy'
      && (
        (github.event_name == 'issues'
          && github.event.issue.user.login != 'notbrent'
          && contains(
            fromJSON(vars.AGENT_WORK_ALLOWLIST || '["brentvatne"]'),
            github.event.issue.user.login
          ))
        || (
          github.event_name == 'issue_comment'
          && !github.event.issue.pull_request
          && github.event.comment.user.login == 'brentvatne'
          && (
            startsWith(github.event.comment.body, '@notbrent ')
            || startsWith(github.event.comment.body, '@notbrent:')
            || startsWith(github.event.comment.body, '@notbrent,')
          )
        )
      )
    runs-on: ubuntu-latest
    outputs:
      run_url: ${{ steps.eas.outputs.run_url }}
    steps:
      - name: Dispatch trusted EAS workflow
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: 2ee288d6-807b-4316-8331-d0f5cd5eebe8
          TRUSTED_GIT_REF: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ID: ${{ github.event.issue.id }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Missing the EXPO_TOKEN repository secret used to dispatch EAS Workflows."
            exit 1
          fi

          payload="$(
            jq -n \
              --arg app_id "$EAS_PROJECT_ID" \
              --arg git_ref "$TRUSTED_GIT_REF" \
              --arg event_name "$EVENT_NAME" \
              --arg issue_number "$ISSUE_NUMBER" \
              --arg issue_id "$ISSUE_ID" \
              --arg comment_id "$COMMENT_ID" \
              '{
                appId: $app_id,
                gitRef: $git_ref,
                fileName: "agent-work.yml",
                inputs: {
                  event_name: $event_name,
                  issue_number: $issue_number,
                  issue_id: $issue_id,
                  comment_id: $comment_id
                }
              }'
          )"
          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $EXPO_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              https://api.expo.dev/v2/workflows/dispatch
          )"
          run_url="$(jq -r '.data.url // empty' <<<"$response")"
          if [[ -z "$run_url" ]]; then
            echo "::error::EAS accepted the request but returned no workflow URL."
            exit 1
          fi
          echo "Dispatched EAS workflow: $run_url"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

  acknowledge:
    name: Link the dispatched workflow
    needs: dispatch
    if: github.event_name == 'issue_comment'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Reply with the EAS workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ needs.dispatch.outputs.run_url }}
        run: |
          if [[ ! "$RUN_URL" =~ ^https://expo\.dev/accounts/brent-org/projects/euxy/workflows/[a-z0-9-]+$ ]]; then
            echo "::error::EAS returned an unexpected workflow URL."
            exit 1
          fi
          comment_url="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              --field body="🤖 Started the [EAS workflow]($RUN_URL) for this request." \
              --jq '.html_url'
          )"
          if [[ -z "$comment_url" ]]; then
            echo "::error::GitHub accepted no acknowledgement comment."
            exit 1
          fi
          echo "Acknowledged dispatch: $comment_url"
