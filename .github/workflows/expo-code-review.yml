name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Comment-only: read the repo, write PR comments (issue comments API).
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      # The published engine is trusted workflow code. Keep the guard and review
      # on the same exact version; bump only in a reviewed change.
      ECR_VERSION: '0.5.2'
    # Trigger policy lives in .expo-code-review/config.jsonc (review.trigger); `ecr ci`
    # self-gates on it (and honors the ai-review:skip label). This coarse gate just
    # avoids spinning up a runner for a PR that explicitly opted out. Uses the array
    # form of contains() for an EXACT label match ("ai-review:skip" is not "ai-review").
    # Prefer to gate entirely here instead? Set config trigger to "label" and replace
    # the line below with, e.g.:
    #   if: contains(github.event.pull_request.labels.*.name, 'ai-review')
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ai-review:skip') }}
    # Backstop so a stalled review fails fast instead of hanging. This is the ONE
    # cap with no soft landing, so it must exceed the CLI's worst-case internal
    # chain (55m passes budget + 10m coordinator + verification + setup).
    timeout-minutes: 90
    # A reviewer failure must never fail the PR's checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load prompts, models, auth routing, and policy only from the trusted
          # base commit. ECR v0.5.2 separately fetches the PR diff and materializes
          # its head in a temporary worktree for source reads.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # Defense in depth: parse every trusted-base ECR config using the same
      # published engine that will run the review. The PR's config is never loaded.
      - name: Guard trusted-base review config
        env:
          ECR_EXPECTED_TOKEN_ENV: ${{ vars.ECR_EXPECTED_TOKEN_ENV || 'CODEX_OAUTH_ACCESS_TOKEN' }}
        run: npx --yes -p "@expo/code-review-cli@$ECR_VERSION" ecr verify-config

      - name: Run AI review
        # The trusted-base config is loaded before ECR enters its temporary PR-head
        # worktree, so PR changes cannot redirect credentials or replace prompts.
        run: npx --yes -p "@expo/code-review-cli@$ECR_VERSION" ecr ci
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ChatGPT/Codex subscription ACCESS token (auth.mode "oauth" in
          # .expo-code-review/config.jsonc reads this env var) — used as-is, no
          # rotation involvement; re-mint before its ~10-day expiry (the token-
          # rotator job, once it exists, keeps it fresh). All reviews run on the
          # subscription.
          CODEX_OAUTH_ACCESS_TOKEN: ${{ secrets.CODEX_OAUTH_ACCESS_TOKEN }}
          # Layer-1 runtime auth lock (mirrors the guard step above).
          ECR_EXPECTED_TOKEN_ENV: ${{ vars.ECR_EXPECTED_TOKEN_ENV || 'CODEX_OAUTH_ACCESS_TOKEN' }}
          # Optional: override the model for every agent (uses your OpenCode login).
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}

      # ECR 0.5.2 can place the next Markdown finding immediately after a raw
      # </details> block. GitHub then displays that finding's Markdown literally.
      # Normalize only that boundary and independently verify the updated body.
      - name: Normalize review comment Markdown
        if: ${{ always() }}
        run: node --experimental-strip-types .github/scripts/normalize-code-review-comment.ts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
