name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Comment-only: read the repo, write PR comments (issue comments API).
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Trigger policy lives in .expo-code-review/config.jsonc (review.trigger); `ecr ci`
    # self-gates on it (and honors the ai-review:skip label). This coarse gate just
    # avoids spinning up a runner for a PR that explicitly opted out. Uses the array
    # form of contains() for an EXACT label match ("ai-review:skip" is not "ai-review").
    # Prefer to gate entirely here instead? Set config trigger to "label" and replace
    # the line below with, e.g.:
    #   if: contains(github.event.pull_request.labels.*.name, 'ai-review')
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ai-review:skip') }}
    # Backstop so a stalled review fails fast instead of hanging. This is the ONE
    # cap with no soft landing, so it must exceed the CLI's worst-case internal
    # chain (55m passes budget + 10m coordinator + verification + setup).
    timeout-minutes: 90
    # A reviewer failure must never fail the PR's checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load prompts, models, auth routing, and policy only from the trusted
          # base commit. ECR separately fetches the PR diff and materializes
          # its head in a temporary worktree for source reads.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      # The anthropic/… models in .expo-code-review/config.jsonc run through the
      # Claude Code CLI (the claude-code engine). Pinned exactly — an unpinned
      # CLI would silently drift on every CI run; bump it deliberately (mirrors
      # expo/code-review-cli's own workflow).
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.212

      # Defense in depth: parse every trusted-base ECR config using the same
      # published engine that will run the review. The PR's config is never loaded.
      - name: Guard trusted-base review config
        env:
          ECR_EXPECTED_TOKEN_ENV: ${{ vars.ECR_EXPECTED_TOKEN_ENV || 'CLAUDE_CODE_REVIEW_SHARED_API_TOKEN' }}
        run: ./scripts/expo-code-review ecr verify-config

      - name: Run AI review
        # The trusted-base config is loaded before ECR enters its temporary PR-head
        # worktree, so PR changes cannot redirect credentials or replace prompts.
        run: ./scripts/expo-code-review ecr ci
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Shared Anthropic review credential (auth.providers.anthropic in
          # .expo-code-review/config.jsonc reads this env var). The claude-code
          # engine forwards it to the Claude Code CLI as the only credential —
          # an `sk-ant-oat…` setup-token or an `sk-ant-api…` Console key both work.
          CLAUDE_CODE_REVIEW_SHARED_API_TOKEN: ${{ secrets.CLAUDE_CODE_REVIEW_SHARED_API_TOKEN }}
          # Search-only credential used for fixed, site-scoped documentation discovery.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          # Layer-1 runtime auth lock (mirrors the guard step above).
          ECR_EXPECTED_TOKEN_ENV: ${{ vars.ECR_EXPECTED_TOKEN_ENV || 'CLAUDE_CODE_REVIEW_SHARED_API_TOKEN' }}
          # Optional: override the model for every agent.
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}

      # Workaround kept from ECR 0.5.2, which could place the next Markdown
      # finding immediately after a raw </details> block (GitHub then displays
      # that finding's Markdown literally). Harmless no-op when the boundary is
      # already fine; drop it once confirmed unnecessary on the current version.
      - name: Normalize review comment Markdown
        if: ${{ always() }}
        run: node --experimental-strip-types .github/scripts/normalize-code-review-comment.ts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
