mode: deterministic
app:
  name: euxy
  platform: ios
  bundleId: dev.brent.euxy
  easProfile: explore
  scheme: euxy
navigation:
  provider: expo-router
device:
  name: iPhone 17
capture:
  maxMinutes: 30
  maxActions: 500
report:
  preview:
    hosting: eas
    expiresAfter: 7d
exploration:
  scope: changes
  # Headless: applies the channel override and returns to the tabs on its first
  # frame, so its landing can never be verified (ROUTE_LANDING_MISMATCH).
  exclude:
    - /c/[channel]
parameters:
  # Headless route: a valid channel name makes a release build switch its EAS
  # Update channel and reload. `_explore` fails parseChannelLink, so the app only
  # posts the "LINK CHANNEL INVALID" notice and returns to the tabs.
  /c/[channel]:
    channel: _explore
  # Opening a share link imports it as the new active pattern, so pin these
  # sheets to the preset instead of whichever pattern is active at that moment.
  /change-icon:
    patternId: preset_lofi
  /device-picker:
    kind: output
  # Share payloads: the Lo-Fi Bounce preset with its effective icon, encoded by
  # src/core/share-codec.ts. Each import adds a copy to the library and makes it
  # the active pattern (a fresh install starts on the "Untitled" seed pattern).
  /p:
    d: AQAC-AYHb25lRHJvcAxMby1GaSBCb3VuY2UEEAMAAAAAADUAaQAZBgRLaWNrEAIEAAAAADcAXAAZBgVTbmFyZRAIAAMBAgA9AEQADwYDSGF0EAEOAAAAADkANwAZBgRTbmFw
  /p/[d]:
    d: AQAC-AYHb25lRHJvcAxMby1GaSBCb3VuY2UEEAMAAAAAADUAaQAZBgRLaWNrEAIEAAAAADcAXAAZBgVTbmFyZRAIAAMBAgA9AEQADwYDSGF0EAEOAAAAADkANwAZBgRTbmFw
  /share-pattern:
    patternId: preset_lofi
setup:
  # Opened by link, the lane editor shows "No lane selected." Open it from the
  # first lane row instead, so it is captured with a lane, then close it.
  - action: open
    url: euxy://
    ready: { identifier: lane-row-title-0 }
  - action: tap
    identifier: lane-row-title-0
    ready: { label: Edit Lane }
  - action: tap
    label: Done
    ready: { identifier: lane-row-title-0 }
